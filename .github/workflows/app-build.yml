name: Build Nalxer App

# 手动跑，或者 app/mobile 下的东西一改就自动跑
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/mobile/**'
      - '.github/workflows/app-build.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装前端依赖
        working-directory: app/mobile
        run: npm install --no-audit --no-fund

      - name: 同步 web 资源到安卓工程
        working-directory: app/mobile
        run: npx cap copy android

      - name: Gradle wrapper 换回官方地址
        working-directory: app/mobile/android
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: 编译 APK
        working-directory: app/mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 收集产物
        run: |
          mkdir -p out
          cp app/mobile/android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Nalxer-android-apk
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 ipa
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app/mobile
        run: npm install --no-audit --no-fund

      - name: 同步 web 资源到 iOS 工程
        working-directory: app/mobile
        run: npx cap copy ios

      - name: 装 CocoaPods 依赖
        working-directory: app/mobile/ios/App
        run: pod install --repo-update

      - name: 真机架构编译（不签名）
        working-directory: app/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打成未签名 ipa
        run: |
          APP="app/mobile/ios/App/build/Build/Products/Release-iphoneos/App.app"
          ls -la "$(dirname "$APP")" || true
          if [ -d "$APP" ]; then
            mkdir -p payload/Payload
            cp -R "$APP" payload/Payload/
            # Info.plist 里塞个短版本，方便辨认
            cd payload && zip -qry "$GITHUB_WORKSPACE/Nalxer-unsigned.ipa" Payload
            cd .. && unzip -l "$GITHUB_WORKSPACE/Nalxer-unsigned.ipa" | head -20
          else
            echo "没有找到 App.app，跳过打包"
            exit 1
          fi

      - name: 顺便验证模拟器也能编
        if: always()
        working-directory: app/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build || echo "模拟器编译失败（不影响 ipa）"

      - uses: actions/upload-artifact@v4
        with:
          name: Nalxer-ios-ipa
          path: Nalxer-unsigned.ipa
          if-no-files-found: warn
